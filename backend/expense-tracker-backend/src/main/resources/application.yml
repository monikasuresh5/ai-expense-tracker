server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/expense_tracker_db
    username: root
    password: YOUR_MYSQL_PASSWORD
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect