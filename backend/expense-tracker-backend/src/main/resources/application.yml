server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/expense_tracker_db
    username: root
    password: ${DB_PASSWORD:changeme}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET:}

gemini:
  api-key: ${GEMINI_API_KEY:}
  # copy the current model name from the sample code in Google AI Studio
  model: gemini-2.5-flash